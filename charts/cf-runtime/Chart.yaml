  artifacthub.io/changes: |
    - kind: security
      description: 'Update "cli" to "1.2.3". Security fixes.'
    - kind: security
      description: 'Update "engine" to "3.3.5". Security fixes.'
    - kind: security
      description: 'Update "cf-container-logger" to "2.0.33". Security fixes.'
    - kind: security
      description: 'Update "cf-docker-builder" to "1.6.13". Security fixes.'
    - kind: security
      description: 'Update "cf-docker-puller" to "8.0.40". Security fixes.'
    - kind: security
      description: 'Update "cf-docker-pusher" to "6.0.39". Security fixes.'
    - kind: security
      description: 'Update "cf-cosign-image-signer" to "3.1.1-cf.2". Security fixes.'
    - kind: security
      description: 'Update "gcloud-builder" to "0.5.18". Security fixes.'
    - kind: security
      description: 'Update "cf-app-proxy" to "0.1.3". Security fixes.'
    - kind: security
      description: 'Update "dind-volume-utils" to "1.30.9". Security fixes.'
    - kind: security
      description: 'Update "dind" to "3.0.20". Security fixes.'
dependencies:
  - name: cf-common
    repository: oci://quay.io/codefresh/charts
    version: 0.21.0
