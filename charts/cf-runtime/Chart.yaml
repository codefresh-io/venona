apiVersion: v2
description: A Helm chart for Codefresh Runner
name: cf-runtime
version: 10.5.6
keywords:
  - codefresh
  - runner
home: https://codefresh.io/
icon: https://avatars1.githubusercontent.com/u/11412079?v=3
sources:
  - https://github.com/codefresh-io/venona
maintainers:
  - name: codefresh
    url: https://codefresh-io.github.io/
annotations:
  # 💡 Do not forget to update this annotation:
  artifacthub.io/containsSecurityUpdates: "true"
  # Supported kinds: `added`, `changed`, `deprecated`, `removed`, `fixed`, `security`:
  artifacthub.io/changes: |
    - kind: fixed
      description: 'Raise default runtime.dind.terminationGracePeriodSeconds from 30s to 300s so the dind SIGTERM cleaner has time to finish pruning inode-dense, reused build-cache volumes before pod teardown'
      links:
        - name: 'Release notes'
          url: 'https://github.com/codefresh-io/venona/releases/tag/cf-runtime-10.5.6-helm'
dependencies:
  - name: cf-common
    repository: oci://quay.io/codefresh/charts
    version: 0.21.0
