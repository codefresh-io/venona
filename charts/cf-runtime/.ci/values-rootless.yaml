volumeProvisioner:
  env:
    IS_ROOTLESS: true
  dind-lv-monitor:
    image:
      tag: 1.30.9-rootless
      digest: sha256:e231e5d5b75424c8580f6e2922db9b1d462df2883435fb92fce9dee36503f52f
    containerSecurityContext:
      runAsUser: 1000
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: "OnRootMismatch"
    volumePermissions:
      enabled: true
runtime:
  dind:
    image:
      tag: 3.0.34-rootless
      digest: sha256:537f80a84e2cf1290399cbdb3063693639497a59d5005ac47f66cddb87246209
    userVolumeMounts:
      dind:
        name: dind
        mountPath: /home/rootless/.local/share/docker
    containerSecurityContext:
      privileged: true
      runAsUser: 1000
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: "OnRootMismatch"
    volumePermissions:
      enabled: true
