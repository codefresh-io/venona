volumeProvisioner:
  env:
    IS_ROOTLESS: true
  dind-lv-monitor:
    image:
      tag: 1.30.9-rootless
      digest: sha256:e231e5d5b75424c8580f6e2922db9b1d462df2883435fb92fce9dee36503f52f
    containerSecurityContext:
      runAsUser: 1000
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: "OnRootMismatch"
    volumePermissions:
      enabled: true
runtime:
  dind:
    image:
      tag: 3.0.29-rootless
      digest: sha256:8153fe9a08b050da2f7aeaa93f897f05f2d4bb7c167a83b667dd25d08ec7555f
    userVolumeMounts:
      dind:
        name: dind
        mountPath: /home/rootless/.local/share/docker
    containerSecurityContext:
      privileged: true
      runAsUser: 1000
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: "OnRootMismatch"
    volumePermissions:
      enabled: true
